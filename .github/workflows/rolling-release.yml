# Builds the Atom Voice firmware on every push to the port's branch and publishes it
# as the "rolling-atom-voice" pre-release, replacing the previous one.
name: Rolling release

on:
  push:
    branches: [dev_AtomVoice]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release-atom-voice
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32
          command: >-
            idf.py build &&
            cd build &&
            esptool.py --chip esp32 merge_bin -o alles-atom-voice.bin @flash_args

      - name: Collect files
        run: |
          mkdir release
          cp build/alles-atom-voice.bin release/
          cp build/alles.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin release/
          # The release is flat, so drop the folders from the paths in flash_args
          sed 's#[^ ]*/##' build/flash_args > release/flash_args

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Firmware for the M5Stack Atom Voice, built from ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`.
          This release is replaced on every push.

          Flash the single image at offset 0x0, at 115200 baud (the Atom's USB serial drops out at faster rates):

          \`\`\`
          esptool.py --chip esp32 -b 115200 write_flash 0x0 alles-atom-voice.bin
          \`\`\`

          The separate images and \`flash_args\` are included for flashing with \`esptool.py write_flash @flash_args\` from the folder they are in.
          EOF
          gh release delete rolling-atom-voice --cleanup-tag --yes || true
          gh release create rolling-atom-voice release/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Atom Voice rolling build (${GITHUB_SHA::7})" \
            --notes-file notes.md
